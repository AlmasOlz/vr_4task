<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR-Nav — маркеры</title>
<style>body{font:16px system-ui;max-width:900px;margin:24px auto;padding:0 20px}img{width:100%;max-width:320px}section{display:inline-block;vertical-align:top;width:340px;max-width:100%;page-break-inside:avoid}button{padding:12px}@media print{header{display:none}section{display:block;page-break-after:always}}</style></head>
<body><header><h1>AR-метки</h1><p>Покажите маркер целиком: изображение Hiro и QR-код. Откройте его на другом экране или распечатайте. Пример маршрута: 901 → 902 → 903.</p><button onclick="window.print()">Печать</button><p><a href="./">Вернуться в приложение</a></p></header><main id="markers"></main>
<script>['901_1','901_2','902_1','902_2','902_3','903','904','905','906','907','908','Elevator','Ladder','m_WC','w_WC','PP_1'].forEach(name=>{const s=document.createElement('section');const h=document.createElement('h2');h.textContent=name;const a=document.createElement('a');a.href='markers/m_'+name+'.png';a.download='m_'+name+'.png';const i=new Image();i.src=a.href;i.alt=name;i.loading='lazy';a.append(i);s.append(h,a);document.getElementById('markers').append(s)})</script></body></html>
